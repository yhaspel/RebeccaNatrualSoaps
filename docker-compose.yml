services:
  api:
    build:
      context: .
      dockerfile: docker/api.dev.Dockerfile
    container_name: rns-api
    ports:
      - "8777:8777"
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: dev-secret
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,api
      CORS_ALLOWED_ORIGINS: http://localhost:4333,http://127.0.0.1:4333
      CSRF_TRUSTED_ORIGINS: http://localhost:4333,http://127.0.0.1:4333
      GROW_REDIRECT_BASE: http://localhost:4333
      GROW_CALLBACK_BASE: http://localhost:8777

  web:
    build:
      context: .
      dockerfile: docker/web.dev.Dockerfile
    container_name: rns-web
    ports:
      - "4333:4333"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
