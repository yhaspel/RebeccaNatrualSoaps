# nginx config baked into the Web image at build time.
# __API_DOMAIN__ is replaced by `sed` in docker/web.Dockerfile using
# the API_HOST build arg (set as a Railway variable on the Web
# service once the API service has a generated public domain).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match the Angular budget warning ceiling — gives big static
    # asset uploads (e.g. raw-image admin uploads) a chance to land.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # nginx-side health check — distinct from Django's /api/health/.
    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    # Proxy API traffic to the Django service via its PUBLIC URL.
    # Railway's private DNS (*.railway.internal) is unreliable from
    # inside an nginx container — use the public domain.
    location /api/ {
        proxy_pass               https://__API_DOMAIN__;
        proxy_ssl_server_name    on;
        proxy_set_header Host    __API_DOMAIN__;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout       120s;
    }

    # Proxy Django admin too, in case Rebecca needs the raw fallback.
    location /admin-django/ {
        proxy_pass               https://__API_DOMAIN__;
        proxy_ssl_server_name    on;
        proxy_set_header Host    __API_DOMAIN__;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache hashed assets (Angular outputHashing: all).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any unknown path returns index.html so the
    # Angular router can take it (products, cart, checkout, etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
